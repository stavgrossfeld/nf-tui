name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:        # so the publish workflow can require a green CI

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 included because that's what development happens on — CI must
        # cover the interpreter the author actually uses, not just older ones.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          # Pinned so the action doesn't ask the GitHub API for "latest" —
          # that lookup failed a build with a TLS/self-signed-certificate
          # error, on a run where every test job had already passed.
          version: "0.11.16"

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q

      - name: Check the package builds
        run: uv build

  install:
    # A build that imports is not the same as a package that installs and runs:
    # this catches missing modules and broken entry points before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"          # see the note in the test job
      - name: Build
        run: uv build
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
      - name: Every entry point starts
        run: |
          /tmp/clean/bin/nf-tui --help
          /tmp/clean/bin/nf-tui-web --help
          /tmp/clean/bin/nf-tui-run --help
          /tmp/clean/bin/nf-tui-mcp --help
          # the MCP server is a stdio protocol server, so --help alone proves
          # little: check it actually answers a JSON-RPC initialize.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            | /tmp/clean/bin/nf-tui-mcp | grep -q '"serverInfo"'
